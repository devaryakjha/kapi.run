<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fbf9" />
    <link rel="icon" href="/kapi-icon.png" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Join the group order · kapi.run</title>
  </head>
  <body>
    <main class="app-page join-page flex flex-col">
      <header class="app-header">
        <div class="app-header__inner items-center w-100">
          <a class="app-header__brand flex items-center" href="/" aria-label="kapi.run home"><img src="/kapi-icon.png" alt="" /><span>kapi.run</span></a>
        </div>
      </header>

      <div class="join-page__content flex">
        <section class="card join-card w-100" aria-labelledby="join-title">
          <header class="join-intro flex">
            <span class="join-intro__icon flex items-center justify-center" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </span>
            <hgroup>
              <h1 id="join-title">Join this order</h1>
              <p class="join-intro__description text-light" data-session-description>
                Confirm your name before adding items.
              </p>
            </hgroup>
          </header>

          <output class="join-loading flex items-center gap-2 text-light" aria-live="polite" aria-busy="true" data-spinner="small" data-join-loading>
            <span>Loading order</span>
          </output>

          <form class="join-form vstack" hidden>
            <div class="join-info" role="alert" data-join-info hidden>
              Your name is shown with the items you submit.
            </div>

            <div class="join-error" role="alert" data-variant="error" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
                <path d="M12 9v4"></path>
                <path d="M12 17h.01"></path>
              </svg>
              <span>
                <strong>Something went wrong</strong>
                <span data-error-message></span>
              </span>
            </div>

            <label class="join-field" for="join-name">
              <span class="text-light">Your name</span>
              <input
                id="join-name"
                name="name"
                autocomplete="name"
                placeholder="Shown in the group cart"
                disabled
              />
            </label>

            <button class="join-submit w-100" type="submit" disabled>
              <span>Join order</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </button>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="/src/join.ts"></script>
  </body>
</html>
